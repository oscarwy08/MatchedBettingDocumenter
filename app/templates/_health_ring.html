{% macro health_ring(health, size='md') %}
  {% if health %}
    <svg class="health-ring size-{{ size }} health-{{ health.level }}" viewBox="0 0 36 36" aria-label="{{ health.percent }} percent healthy">
      <circle class="health-ring-track" cx="18" cy="18" r="15.9155"></circle>
      <circle class="health-ring-value" cx="18" cy="18" r="15.9155"
              stroke-dasharray="{{ health.percent }} 100"
              transform="rotate(-90 18 18)"></circle>
      <text x="18" y="21.2">{{ health.percent }}</text>
    </svg>
  {% endif %}
{% endmacro %}
